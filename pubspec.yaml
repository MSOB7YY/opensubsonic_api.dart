name: opensubsonic_api
description: opensubsonic_api.dart is a wrapper for the Subsonic API in Dart, with additional support for OpenSubsonic.
version: 0.3.1
homepage: https://github.com/RanKKI/opensubsonic_api.dart
repository: https://github.com/RanKKI/opensubsonic_api.dart

environment:
  sdk: ^3.8.0

dependencies:
  crypto: ^3.0.5
  dio: ^5.9.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  retrofit: '>=4.0.0 <5.0.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
  build_runner: ^2.6.0
  freezed: ^3.2.4
  json_serializable: ^6.10.0
  retrofit_generator: ^10.0.1
  http_mock_adapter: ^0.6.1

topics:
  - subsonic